[package]
name = "agent-fabric"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "fabric"
path = "src/main.rs"

[dependencies]
anyhow = "1"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonschema = { version = "0.29", default-features = false }

[dev-dependencies]
tempfile = "3"
