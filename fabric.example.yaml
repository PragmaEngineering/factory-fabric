version: 1
name: example
concurrency: 4
packages:
  - name: utility
    path: ./examples
    entrypoint: echo.sh
    args: []
    working_directory: .
    elapsed_seconds: 60
    capabilities:
      - name: echo
        description: Return a structured value unchanged.
        version: "1"
        input_schema: {type: object}
        output_schema: {type: object}
      - name: inspect
        description: Inspect structured task context.
        version: "1"
        input_schema:
          type: object
          required: [task]
          properties:
            task: {type: string}
          additionalProperties: false
        output_schema: {type: object}
