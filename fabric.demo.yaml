# Mirrors ../registry/factories/golang/factory.yaml packages without its workflow.
# Relative package paths resolve beside this file for the managed local stack.
# working_directory selects the Go Controls checkout; change it for your project
# or supply an execution-host working_directory when invoking a capability.
# Registry launchers retain their native Pi profiles and linked skills.
# All packages use the shared assignment MCP contract; Pi preparation is selected
# explicitly below. Workflow routes, hooks, admission gates and worktree management
# remain Factory concerns and are not copied.
# For an executable deterministic collaboration demo, use fabric.collaboration.yaml.
version: 1
name: golang
concurrency: 4
packages:
- name: readiness
  protocol: mcp
  path: ../registry/classifiers/task-readiness
  entrypoint: start.sh
  working_directory: ../controls
  elapsed_seconds: 60
  environment:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
  overrides:
    provider: openrouter
    endpoint: https://openrouter.ai/api/alpha/decisions
    model: typesafe/jev-1.14
    api_key_env: OPENROUTER_API_KEY
    timeout_ms: 20000
    max_request_bytes: 24000
    max_response_bytes: 24000
    admission:
      minimum_probability: 0.85
  capabilities:
  - name: assess
    description: Assess whether a Go task is sufficiently actionable.
    version: '1'
    input_schema:
      type: object
      required:
      - task
      properties:
        task:
          type: string
        context:
          type: object
    output_schema:
      type: object
- name: architect
  protocol: mcp
  runtime: {name: pi, version: ">=1.0.0 <2.0.0"}
  path: ../registry/agents/architect
  entrypoint: start.sh
  working_directory: ../controls
  elapsed_seconds: 1800
  environment:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
  overrides:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    base_url: https://openrouter.ai/api/v1
    api: openai-completions
    api_key_env: OPENROUTER_API_KEY
    thinking: high
    model_config:
      name: DeepSeek V4 Flash
      reasoning: true
      context_window: 1048576
      max_tokens: 16384
      input:
      - text
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
  capabilities:
  - name: design
    description: Develop a specification and implementation plan for a Go task.
    version: '1'
    input_schema:
      type: object
      required:
      - task
      properties:
        task:
          type: string
        context:
          type: object
    output_schema:
      type: object
- name: architecture_reviewer
  protocol: mcp
  runtime: {name: pi, version: ">=1.0.0 <2.0.0"}
  path: ../registry/agents/architecture_reviewer
  entrypoint: start.sh
  working_directory: ../controls
  elapsed_seconds: 1800
  environment:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
  overrides:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    base_url: https://openrouter.ai/api/v1
    api: openai-completions
    api_key_env: OPENROUTER_API_KEY
    thinking: high
    model_config:
      name: DeepSeek V4 Flash
      reasoning: true
      context_window: 1048576
      max_tokens: 16384
      input:
      - text
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
  capabilities:
  - name: review
    description: Independently review the specification and implementation plan.
    version: '1'
    input_schema:
      type: object
      required:
      - task
      properties:
        task:
          type: string
        context:
          type: object
    output_schema:
      type: object
- name: coder_golang
  protocol: mcp
  runtime: {name: pi, version: ">=1.0.0 <2.0.0"}
  path: ../registry/agents/coder_golang
  entrypoint: start.sh
  working_directory: ../controls
  elapsed_seconds: 1800
  environment:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
  overrides:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    base_url: https://openrouter.ai/api/v1
    api: openai-completions
    api_key_env: OPENROUTER_API_KEY
    thinking: medium
    model_config:
      name: DeepSeek V4 Flash
      reasoning: true
      context_window: 1048576
      max_tokens: 16384
      input:
      - text
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
  capabilities:
  - name: implement
    description: Implement a Go task using the supplied design and project context.
    version: '1'
    input_schema:
      type: object
      required:
      - task
      properties:
        task:
          type: string
        context:
          type: object
    output_schema:
      type: object
- name: code_reviewer_golang
  protocol: mcp
  runtime: {name: pi, version: ">=1.0.0 <2.0.0"}
  path: ../registry/agents/code_reviewer_golang
  entrypoint: start.sh
  working_directory: ../controls
  elapsed_seconds: 1800
  environment:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
  overrides:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    base_url: https://openrouter.ai/api/v1
    api: openai-completions
    api_key_env: OPENROUTER_API_KEY
    thinking: high
    model_config:
      name: DeepSeek V4 Flash
      reasoning: true
      context_window: 1048576
      max_tokens: 16384
      input:
      - text
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
  capabilities:
  - name: review
    description: Independently review Go implementation changes and verification evidence.
    version: '1'
    input_schema:
      type: object
      required:
      - task
      properties:
        task:
          type: string
        context:
          type: object
    output_schema:
      type: object
